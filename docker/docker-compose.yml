volumes:
    db-data:

services:
  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=$DB_NAME
      - POSTGRES_PASSWORD=$DB_PASSWORD
  web:
    # use pre-built image
    image: healthchecks/healthchecks:latest
    # build:
    #     context: ..
    #     dockerfile: docker/Dockerfile
    env_file:
        - .env
    # specifying directly in coolify worked. (healthchecks.calmmage.com:8000)
    # ports:
        # - "53163:8000"
        # To enable SMTP on port 2525, set SMTPD_PORT=2525 in .env
        # and uncomment the following line:
        # - "2525:2525"
    depends_on:
        - db
    command: bash -c 'while !</dev/tcp/db/5432; do sleep 1; done; uwsgi /opt/healthchecks/docker/uwsgi.ini'

